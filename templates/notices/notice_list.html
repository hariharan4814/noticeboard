{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <div class="d-flex justify-content-between mb-3">

        <h2>Notices</h2>

        <a href="{% url 'notice_create' %}" class="btn btn-success">
            Add Notice
        </a>

    </div>

   <form method="get" class="row g-2 mb-3">

    <div class="col-md-5">
        <input
            type="text"
            name="q"
            class="form-control"
            placeholder="Search notices..."
            value="{{ query|default:'' }}"
        >
    </div>

    <div class="col-md-4">
        <select name="type" class="form-select">
            <option value="">All Types</option>

            {% for value, label in notice_types %}
                <option value="{{ value }}"
                    {% if selected_type == value %}selected{% endif %}>
                    {{ label }}
                </option>
            {% endfor %}
        </select>
    </div>

    <div class="col-md-3">
        <button class="btn btn-primary w-100">
            Filter
        </button>
    </div>

</form>




    <table class="table table-bordered">

        <thead>
            <tr>
                <th>Title</th>
                <th>Type</th>
                <th>Created By</th>
                <th>Date</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody>

        {% for notice in notices %}

            <tr>
                <td>
                    <a href="{% url 'notice_detail' notice.pk %}">
                    {{ notice.title }}
                    </a>
                </td>
                <td>{{ notice.notice_type }}</td>
                <td>{{ notice.created_by }}</td>
                <td>{{ notice.created_at }}</td>
                <td>
                    <a href="{% url 'notice_update' notice.pk %}" class="btn btn-primary btn-sm">
                        Edit
                    </a>
                    <a href="{% url 'notice_delete' notice.pk %}" class="btn btn-danger btn-sm">
                        Delete
                    </a>
                </td>
            </tr>

        {% empty %}

            <tr>
                <td colspan="5">No notices available.</td>
            </tr>

        {% endfor %}

        </tbody>

    </table>

</div>

{% endblock %}
