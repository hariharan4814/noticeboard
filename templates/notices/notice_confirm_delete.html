{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

    <div class="card">
        <div class="card-body">

            <h3>Delete Notice</h3>

            <p>
                Are you sure you want to delete
                <strong>{{ notice.title }}</strong>?
            </p>

            <form method="post">
                {% csrf_token %}

                <button type="submit" class="btn btn-danger">
                    Delete
                </button>

                <a href="{% url 'notice_list' %}" class="btn btn-secondary">
                    Cancel
                </a>

            </form>

        </div>
    </div>

</div>

{% endblock %}
