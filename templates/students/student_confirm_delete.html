{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card shadow-sm border-danger">
                <div class="card-body">
                    <h2 class="card-title text-danger mb-3">Delete Student</h2>

                    <p class="mb-3">Are you sure you want to delete this student?</p>

                    <div class="table-responsive mb-3">
                        <table class="table table-bordered mb-0">
                            <tr>
                                <th>Roll Number</th>
                                <td>{{ student.roll_number }}</td>
                            </tr>
                            <tr>
                                <th>Name</th>
                                <td>{{ student.name }}</td>
                            </tr>
                            <tr>
                                <th>Department</th>
                                <td>{{ student.department }}</td>
                            </tr>
                            <tr>
                                <th>Year</th>
                                <td>{{ student.get_year_display }}</td>
                            </tr>
                        </table>
                    </div>

                    <form method="post" class="d-flex gap-2">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger">
                            Yes, Delete
                        </button>

                        <a href="{% url 'students:student_detail' student.pk %}" class="btn btn-secondary">
                            Cancel
                        </a>
                    </form>
                </div>
            </div>
        </div>
    </div>

</div>

{% endblock %}
